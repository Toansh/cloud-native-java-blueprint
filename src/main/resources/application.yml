spring:
  application:
    name: cloud-native-java-blueprint
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blueprint_db}
    username: ${SPRING_DATASOURCE_USERNAME:blueprint_user}
    password: ${SPRING_DATASOURCE_PASSWORD:blueprint_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BlueprintHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 5
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

app:
  outbox:
    topic: order-events
    poll-interval-ms: 500
    batch-size: 100
    max-retries: 5

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10s
    instances:
      orderService:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    enabled: true
    sampling:
      probability: 1.0
